[package]
name = "ore-fork-sim"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM mainnet-fork check of EdgeORE's ORE v3 Deploy bytes. Sends nothing to any cluster."

[workspace]

[dependencies]

[dev-dependencies]
litesvm = "=0.18.0"
solana-account = "4.3.0"
solana-address = { version = "~2.7.0", features = ["curve25519", "sha2"] }
solana-clock = "~3.2.0"
solana-hash = "~4.6.0"
solana-message = "4.2.4"
solana-signature = "~3.5.2"
solana-transaction = "4.1.5"
solana-instruction = "*"
base64 = "0.22.1"
serde_json = "1.0.151"
