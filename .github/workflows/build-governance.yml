name: Build governance and qualification
# Read-only: no secrets are referenced, nothing is published, deployed or signed with a release key.
# pull_request (not pull_request_target), so fork PRs run without repository secrets or write tokens.
# Actions are pinned to the commits their major tags pointed at when this was reviewed; re-review before bumping.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-governance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy-and-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: bash scripts/commit-stamp.sh check
      - run: python3 scripts/build-policy.py
      - run: python3 scripts/test_build_policy.py -v
      - run: python3 scripts/test_mobsf_policy.py
      - run: python3 -m unittest discover -s services/storage-gateway -v
      - run: python3 -m unittest discover -s tools/edgeore-kit -v
  static-analysis:
    # Standalone detekt-cli and ktlint jars (checksum-pinned in scripts/lint-static.sh); new findings fail, baselined ones do not.
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/lint-static.sh
  android:
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Android source gate (not device evidence)
        run: bash scripts/qualify.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-gate-${{ github.sha }}
          path: |
            evidence/build-*/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  receipt-checker:
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew --no-daemon -p tools/receipt-checker test installDist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: receipt-checker-${{ github.sha }}
          path: tools/receipt-checker/build/test-results/
  screenshots:
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew --no-daemon :app:verifyRoborazziDebug -Pscreens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/outputs/roborazzi/
  release-r8:
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Unsigned minified release (R8) (no release key in CI)
        run: bash gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-r8-${{ github.sha }}
          path: |
            app/build/outputs/mapping/release/
