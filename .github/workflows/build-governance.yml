name: Build governance and qualification
# Read-only: no secrets are referenced, nothing is published, deployed or signed with a release key.
# pull_request (not pull_request_target), so fork PRs run without repository secrets or write tokens.
# Actions are pinned to the commits their major tags pointed at when this was reviewed; re-review before bumping.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-governance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy-and-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (tag resolved 2026-10-10)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (tag resolved 2026-10-10)
        with:
          python-version: '3.12'
      - run: python3 scripts/build-policy.py
      - run: python3 scripts/test_build_policy.py -v
      - run: python3 -m unittest discover -s services/storage-gateway -v
      - run: python3 -m unittest discover -s tools/edgeore-kit -v
  android:
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (tag resolved 2026-10-10)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (tag resolved 2026-10-10)
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (tag resolved 2026-10-10)
        with:
          distribution: temurin
          java-version: '17'
      - name: Android source gate (not device evidence)
        run: bash scripts/qualify.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (tag resolved 2026-10-10)
        if: always()
        with:
          name: android-gate-${{ github.sha }}
          path: |
            evidence/build-*/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  receipt-checker:
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (tag resolved 2026-10-10)
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (tag resolved 2026-10-10)
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew --no-daemon -p tools/receipt-checker test installDist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (tag resolved 2026-10-10)
        if: always()
        with:
          name: receipt-checker-${{ github.sha }}
          path: tools/receipt-checker/build/test-results/
  screenshots:
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (tag resolved 2026-10-10)
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (tag resolved 2026-10-10)
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew --no-daemon :app:verifyRoborazziDebug -Pscreens
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (tag resolved 2026-10-10)
        if: always()
        with:
          name: screenshots-${{ github.sha }}
          path: app/build/test-results/
  release-r8:
    needs: policy-and-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (tag resolved 2026-10-10)
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (tag resolved 2026-10-10)
        with:
          distribution: temurin
          java-version: '17'
      - name: Unsigned minified release (R8) (no release key in CI)
        run: bash gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (tag resolved 2026-10-10)
        if: always()
        with:
          name: release-r8-${{ github.sha }}
          path: |
            app/build/outputs/mapping/release/
