name: MobSF static scan (local container)
# Scans an unminified release variant signed with a disposable CI key, never the owner release key.
# No repository secrets are used; the MobSF API key is random per run and the report is only an artifact.
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'gradle/**', '.github/workflows/mobsf.yml', 'scripts/mobsf-scan.sh', 'scripts/mobsf-policy.py', 'scripts/test_mobsf_policy.py']
permissions:
  contents: read
jobs:
  mobsf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew --no-daemon :app:assembleRelease -PsecurityScan
      - name: Sign scanner input with disposable CI key
        run: |
          python3 -c 'import secrets; print(secrets.token_hex(32))' > "$RUNNER_TEMP/scan.pass"
          cp "$RUNNER_TEMP/scan.pass" "$RUNNER_TEMP/scan-key.pass"
          trap 'rm -f "$RUNNER_TEMP/scan.pass" "$RUNNER_TEMP/scan-key.pass" "$RUNNER_TEMP/scan.jks"' EXIT
          keytool -genkeypair -keystore "$RUNNER_TEMP/scan.jks" -storepass:file "$RUNNER_TEMP/scan.pass" -keypass:file "$RUNNER_TEMP/scan.pass" -alias scan -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Disposable CI scanner input' >/dev/null 2>&1
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" sign --ks "$RUNNER_TEMP/scan.jks" --ks-pass "file:$RUNNER_TEMP/scan.pass" --key-pass "file:$RUNNER_TEMP/scan-key.pass" --out app/build/outputs/apk/release/app-release-scan.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify app/build/outputs/apk/release/app-release-scan.apk
      - run: python3 scripts/test_mobsf_policy.py
      - run: bash scripts/mobsf-scan.sh app/build/outputs/apk/release/app-release-scan.apk evidence/mobsf/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobsf-${{ github.sha }}
          path: evidence/mobsf/ci/
