name: MobSF static scan (local container)
# Builds the unsigned release APK and scans it with a MobSF container started inside the runner.
# No repository secrets are used; the MobSF API key is random per run and the report is only an artifact.
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'gradle/**', '.github/workflows/mobsf.yml', 'scripts/mobsf-scan.sh']
permissions:
  contents: read
jobs:
  mobsf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (tag resolved 2026-10-10)
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (tag resolved 2026-10-10)
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew --no-daemon :app:assembleRelease
      - run: bash scripts/mobsf-scan.sh app/build/outputs/apk/release/app-release-unsigned.apk evidence/mobsf/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (tag resolved 2026-10-10)
        if: always()
        with:
          name: mobsf-${{ github.sha }}
          path: evidence/mobsf/ci/
