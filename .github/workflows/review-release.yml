name: Prepare Android review release

on:
  workflow_dispatch:
    inputs:
      review_tag:
        description: Existing review tag to qualify and attach to a draft prerelease
        required: true
        default: v0.1.0-clockin-review.1
        type: string

permissions:
  contents: read

concurrency:
  group: android-review-${{ inputs.review_tag }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Validate review tag
        env:
          REVIEW_TAG: ${{ inputs.review_tag }}
        run: |
          [[ "$REVIEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.-]*review[A-Za-z0-9.-]*$ ]] || exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.review_tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Record exact tagged source
        id: identity
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Qualify review source
        run: |
          python3 scripts/build-policy.py
          python3 -m unittest discover -s services/storage-gateway -v
          python3 -m unittest discover -s tools/edgeore-kit -v
          bash scripts/qualify.sh
          bash gradlew --no-daemon -p tools/receipt-checker test
          bash gradlew --no-daemon :app:verifyRoborazziDebug -Pscreens
      - name: Package debug APK and evidence
        env:
          REVIEW_TAG: ${{ inputs.review_tag }}
        run: |
          mkdir -p review-package
          cp app/build/outputs/apk/debug/app-debug.apk review-package/EdgeORE-debug.apk
          cp NOTICE review-package/NOTICE
          if [ -f LICENSE ]; then cp LICENSE review-package/LICENSE; fi
          cp -r "evidence/build-$(git rev-parse --short=12 HEAD)" review-package/build-evidence
          cp -r tools/receipt-checker/build/test-results/test review-package/receipt-checker-junit
          cp -r app/build/test-results/testDebugUnitTest review-package/screens-junit
          git rev-parse HEAD > review-package/SOURCE.txt
          printf '%s\n' "$REVIEW_TAG" > review-package/TAG.txt
          printf '%s\n' 'Debug review candidate. Device/wallet/provider gates NOT_RUN. No production signing or token-earning claim.' > review-package/STATUS.txt
          sha256sum review-package/EdgeORE-debug.apk > review-package/APK-SHA256.txt
          zip -q -r "EdgeORE-${REVIEW_TAG}.zip" review-package
          cp review-package/EdgeORE-debug.apk EdgeORE-debug.apk
          sha256sum EdgeORE-debug.apk "EdgeORE-${REVIEW_TAG}.zip" > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-review-${{ github.run_id }}
          if-no-files-found: error
          path: |
            EdgeORE-debug.apk
            EdgeORE-*.zip
            SHA256SUMS.txt
            review-package/SOURCE.txt

  draft-release:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-review-${{ github.run_id }}
          path: downloaded
      - name: Check tag identity and prepare notes
        env:
          REVIEW_TAG: ${{ inputs.review_tag }}
          EXPECTED_SOURCE: ${{ needs.qualify.outputs.source_sha }}
        run: |
          git fetch origin "refs/tags/$REVIEW_TAG:refs/tags/$REVIEW_TAG"
          [ "$(git rev-parse "refs/tags/$REVIEW_TAG^{commit}")" = "$EXPECTED_SOURCE" ]
          [ "$(cat downloaded/review-package/SOURCE.txt)" = "$EXPECTED_SOURCE" ]
          (cd downloaded && sha256sum -c SHA256SUMS.txt)
          cp .github/release-review-notes.md release-notes.md
          printf '\nTested tag: `%s`\nSource: `%s`\nCI run: %s/%s/actions/runs/%s\n' "$REVIEW_TAG" "$EXPECTED_SOURCE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
      - name: Create draft prerelease with review assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW_TAG: ${{ inputs.review_tag }}
        run: |
          gh release create "$REVIEW_TAG" --verify-tag --draft --prerelease \
            --title "EdgeORE $REVIEW_TAG — debug review candidate" --notes-file release-notes.md \
            downloaded/EdgeORE-debug.apk "downloaded/EdgeORE-${REVIEW_TAG}.zip" downloaded/SHA256SUMS.txt
